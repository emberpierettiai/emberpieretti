<!doctype html>
<html lang="en">

<title>Projects in progress · Emberson Pieretti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<style>
/*
  LAYOUT: a quiet header, one line of intro, the card fan centred on the page, and below it a fixed-height
  detail panel for whichever project is raised. Everything centre-aligned around the fan.
*/
:root {
  --ground: #0a0a0a;   /* page, as the carousel spec asks: near black */
  --paper:  #f2eee9;   /* headings */
  --mute:   #9b958f;   /* secondary text */
  --line:   rgba(255, 255, 255, .1);
  --live:   #6fd39a;   /* status: live */
  --build:  #f0b45a;   /* status: in progress */
  --next:   #8e9aa6;   /* status: up next */
  --focus:  #ffcf8a;

  --f-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --f-text: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;

  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--ground); }
body { color: var(--paper); font-family: var(--f-text); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

.page { min-height: 100vh; min-height: 100svh; overflow-x: clip; display: flex; flex-direction: column; padding-left: var(--gl); padding-right: var(--gr); }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: max(14px, env(safe-area-inset-top, 0px)) 0; }
.who { font-size: .875rem; font-weight: 500; color: var(--paper); text-decoration: none; }
.who.back { color: var(--mute); }
.who:hover { color: var(--paper); }
.who:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
.lang { display: flex; gap: 2px; }
.lang button {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: 500 .8125rem/1 var(--f-text); color: var(--mute);
  min-width: 44px; min-height: 36px; padding: 0 12px; border-radius: 999px;
  transition: color 200ms ease-out, background-color 200ms ease-out;
}
.lang button:hover { color: var(--paper); }
.lang button[aria-pressed="true"] { background: var(--paper); color: var(--ground); }
.lang button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.intro { text-align: center; display: grid; gap: 10px; justify-items: center; padding-block: clamp(20px, 4.5vh, 56px) 0; }
.intro h1 {
  margin: 0; font-family: var(--f-display); font-weight: 700;
  font-size: clamp(2rem, 1.2rem + 3.4vw, 4rem); line-height: 1; letter-spacing: -0.035em; text-wrap: balance;
}
.intro p { margin: 0; color: var(--mute); font-size: clamp(.95rem, .9rem + .2vw, 1.05rem); line-height: 1.5; max-width: 44ch; text-wrap: balance; }

.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; padding-block: 8px; }

/* detail panel under the fan */
@media (max-height: 760px) { .detail { height: 8rem; } .intro p { display: none; } }
.detail {
  display: grid; justify-items: center; text-align: center; gap: 8px;
  height: 9.5rem; overflow: hidden; padding-block: 4px max(24px, env(safe-area-inset-bottom, 0px));
}
.detail h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(1.35rem, 1.1rem + .9vw, 1.9rem); letter-spacing: -0.02em; }
.detail p { margin: 0; color: var(--mute); line-height: 1.5; max-width: 42ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.detail .open {
  margin-top: 6px; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 18px;
  border-radius: 999px; border: 1px solid var(--line); color: var(--paper); text-decoration: none; font-size: .9rem; font-weight: 500;
  transition: border-color 200ms ease-out, background-color 200ms ease-out;
}
.detail .open:hover { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.04); }
.detail .open:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.detail .soon { margin-top: 6px; min-height: 40px; display: inline-flex; align-items: center; color: var(--mute); font-size: .9rem; }
.detail-body { display: grid; justify-items: center; gap: 8px; transition: opacity 150ms ease-out; }

.status { display: inline-flex; align-items: center; gap: 7px; font-size: .8125rem; color: var(--mute); }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status[data-s="live"] { color: var(--live); }
.status[data-s="build"] { color: var(--build); }
.status[data-s="next"] { color: var(--next); }

@media (prefers-reduced-motion: reduce) {
  .lang button, .detail .open, .detail-body { transition: none; }
}
</style>

<div class="page">
  <header class="bar">
    <a class="who" href="/">Emberson Pieretti</a>
    <a class="who back" href="/">Home</a>
  </header>
  <div id="app" class="stage-wrap" style="display:contents"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
(() => {
  'use strict';
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= illustrations, painted once on canvas ================= */
  const W = 640, H = 1120;
  function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function canvas() { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; }
  function linear(ctx, stops, x0 = 0, y0 = 0, x1 = 0, y1 = H) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
  function radial(ctx, x, y, r0, r1, stops, fx, fy) { const g = ctx.createRadialGradient(fx ?? x, fy ?? y, r0, x, y, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
  function glow(ctx, x, y, r, color, a) {
    ctx.fillStyle = radial(ctx, x, y, 0, r, [[0, color.replace('A', a)], [1, color.replace('A', 0)]]);
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function finish(ctx, c, seed, vig = 0.75, grainAmt = 14) {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = radial(ctx, W / 2, H * 0.46, H * 0.18, H * 0.78, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,' + vig + ')']]);
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    const r = rng(seed), id = ctx.getImageData(0, 0, W, H), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * grainAmt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    ctx.putImageData(id, 0, 0);
    return c.toDataURL('image/jpeg', 0.86);
  }
  function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  /* 1. Big Dream Events: round backdrop with an organic balloon garland and fairy lights */
  function paintParty() {
    const [c, ctx] = canvas(), r = rng(11);
    ctx.fillStyle = linear(ctx, [[0, '#2b1a1e'], [0.55, '#140c0e'], [1, '#070505']]); ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 70; i++) glow(ctx, r() * W, r() * H * 0.85, 6 + r() * 26, 'rgba(255,205,140,A)', 0.12 + r() * 0.3);
    /* round backdrop panel */
    const cx = W * 0.52, cy = H * 0.43, R = 236;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = radial(ctx, cx, cy, 10, R, [[0, '#f4e9dc'], [0.75, '#e2cfb9'], [1, '#c8b39a']], cx - 70, cy - 90); ctx.fill(); ctx.restore();
    ctx.strokeStyle = 'rgba(214,176,108,.9)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, R + 4, 0, Math.PI * 2); ctx.stroke();
    /* floor */
    ctx.fillStyle = linear(ctx, [[0, 'rgba(60,40,36,0)'], [1, 'rgba(60,40,36,.55)']], 0, H * 0.72, 0, H); ctx.fillRect(0, H * 0.72, W, H * 0.28);
    /* balloon garland along a curve that hugs the backdrop's left side and spills to the floor */
    const pal = [
      ['#f7d9d3', '#e5a9a2', '#8f4f4c'], ['#f6ead2', '#e3cc9e', '#8c7243'], ['#fffaf2', '#efe5d6', '#a59682'],
      ['#ffe7a8', '#cda04a', '#5e4316'], ['#e9b8bd', '#c7848c', '#6b3740'], ['#fbefe9', '#e9cfc6', '#9a7c72']
    ];
    const pts = [];
    for (let t = 0; t <= 1; t += 0.012) {
      const a = -1.15 - t * 2.6;
      const rr = R + 18 * Math.sin(t * 9);
      let x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      if (t > 0.72) { const k = (t - 0.72) / 0.28; x = lerp(x, cx + 150, k * 0.6); y = lerp(y, H * 0.86, k); }
      pts.push([x, y, t]);
    }
    const balloons = [];
    pts.forEach(([x, y, t]) => {
      const n = 2 + Math.floor(r() * 3);
      for (let i = 0; i < n; i++) {
        const size = (t > 0.72 ? 52 : 40) * (0.45 + r() * 0.9);
        balloons.push([x + (r() - 0.5) * 70, y + (r() - 0.5) * 70, size, pal[Math.floor(r() * pal.length)], r() < 0.16]);
      }
    });
    balloons.sort((a, b) => b[2] - a[2]);
    balloons.forEach(([x, y, s, p, chrome]) => {
      ctx.save();
      ctx.shadowColor = 'rgba(20,8,8,.55)'; ctx.shadowBlur = s * 0.5; ctx.shadowOffsetY = s * 0.18;
      ctx.beginPath(); ctx.ellipse(x, y, s, s * 1.06, 0, 0, Math.PI * 2);
      ctx.fillStyle = radial(ctx, x, y, s * 0.04, s * 1.08,
        chrome ? [[0, '#fff6d8'], [0.25, '#e8c46a'], [0.6, '#8a6420'], [1, '#2e1f08']] : [[0, p[0]], [0.5, p[1]], [1, p[2]]],
        x - s * 0.38, y - s * 0.42);
      ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(x - s * 0.4, y - s * 0.46); ctx.rotate(-0.6);
      ctx.beginPath(); ctx.ellipse(0, 0, s * 0.2, s * 0.1, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (chrome ? 0.85 : 0.5) + ')'; ctx.fill(); ctx.restore();
    });
    for (let i = 0; i < 26; i++) glow(ctx, r() * W, r() * H, 3 + r() * 9, 'rgba(255,220,160,A)', 0.5 + r() * 0.4);
    return finish(ctx, c, 101, 0.7);
  }

  /* 2. Link da bio: a phone with stacked link buttons */
  function paintLinks() {
    const [c, ctx] = canvas(), r = rng(23);
    ctx.fillStyle = linear(ctx, [[0, '#1f1517'], [1, '#060405']]); ctx.fillRect(0, 0, W, H);
    glow(ctx, W * 0.5, H * 0.45, 420, 'rgba(232,150,150,A)', 0.28);
    for (let i = 0; i < 40; i++) glow(ctx, r() * W, r() * H, 4 + r() * 18, 'rgba(255,200,190,A)', 0.1 + r() * 0.25);
    const px = 150, py = 170, pw = 340, ph = 720;
    ctx.save(); ctx.translate(W / 2, py + ph / 2); ctx.rotate(-0.07); ctx.translate(-W / 2, -(py + ph / 2));
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 40;
    rrect(ctx, px, py, pw, ph, 56); ctx.fillStyle = '#121112'; ctx.fill(); ctx.restore();
    rrect(ctx, px, py, pw, ph, 56); ctx.strokeStyle = linear(ctx, [[0, 'rgba(255,255,255,.35)'], [0.5, 'rgba(255,255,255,.05)'], [1, 'rgba(255,255,255,.2)']], px, py, px + pw, py + ph); ctx.lineWidth = 3; ctx.stroke();
    const sx = px + 14, sy = py + 14, sw = pw - 28, sh = ph - 28;
    rrect(ctx, sx, sy, sw, sh, 44); ctx.save(); ctx.clip();
    ctx.fillStyle = linear(ctx, [[0, '#f8ebe6'], [1, '#ecd2cc']], 0, sy, 0, sy + sh); ctx.fillRect(sx, sy, sw, sh);
    rrect(ctx, sx + sw / 2 - 52, sy + 14, 104, 26, 13); ctx.fillStyle = '#121112'; ctx.fill();
    const ax = sx + sw / 2, ay = sy + 128;
    ctx.beginPath(); ctx.arc(ax, ay, 56, 0, Math.PI * 2); ctx.fillStyle = linear(ctx, [[0, '#e7c27a'], [1, '#b98a3c']], ax - 56, ay - 56, ax + 56, ay + 56); ctx.fill();
    ctx.beginPath(); ctx.arc(ax, ay, 49, 0, Math.PI * 2); ctx.fillStyle = radial(ctx, ax, ay, 4, 52, [[0, '#f3d6cf'], [1, '#c99189']], ax - 14, ay - 18); ctx.fill();
    rrect(ctx, ax - 80, ay + 76, 160, 16, 8); ctx.fillStyle = 'rgba(60,40,40,.7)'; ctx.fill();
    rrect(ctx, ax - 56, ay + 102, 112, 11, 6); ctx.fillStyle = 'rgba(60,40,40,.3)'; ctx.fill();
    const dots = ['#e58c8c', '#d9b06a', '#8fb7a2', '#9aa7d6', '#d79bc0'];
    for (let i = 0; i < 5; i++) {
      const by = ay + 150 + i * 74;
      ctx.save(); ctx.shadowColor = 'rgba(120,60,60,.18)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
      rrect(ctx, sx + 26, by, sw - 52, 58, 29); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill(); ctx.restore();
      ctx.beginPath(); ctx.arc(sx + 58, by + 29, 15, 0, Math.PI * 2); ctx.fillStyle = dots[i]; ctx.fill();
      rrect(ctx, sx + 86, by + 23, 110 + r() * 60, 12, 6); ctx.fillStyle = 'rgba(70,50,50,.45)'; ctx.fill();
    }
    ctx.restore();
    /* glass reflection */
    rrect(ctx, px, py, pw, ph, 56); ctx.save(); ctx.clip();
    ctx.fillStyle = linear(ctx, [[0, 'rgba(255,255,255,.16)'], [0.4, 'rgba(255,255,255,0)'], [1, 'rgba(255,255,255,0)']], px, py, px + pw * 0.9, py + ph * 0.55);
    ctx.fillRect(px, py, pw, ph); ctx.restore();
    ctx.restore();
    /* floating hearts */
    function heart(x, y, s, a) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = a;
      ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -6, -8, -18, 0, -10); ctx.bezierCurveTo(8, -18, 14, -6, 0, 6);
      ctx.fillStyle = '#f19c9c'; ctx.shadowColor = 'rgba(241,156,156,.8)'; ctx.shadowBlur = 18; ctx.fill(); ctx.restore();
    }
    heart(500, 190, 2.4, 0.9); heart(540, 300, 1.4, 0.6); heart(110, 880, 1.8, 0.7); heart(90, 300, 1.1, 0.45);
    return finish(ctx, c, 202, 0.7);
  }

  /* 3. Meu website: a single ember spark in the dark with rising embers */
  function paintEmber() {
    const [c, ctx] = canvas(), r = rng(37);
    ctx.fillStyle = '#030202'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const x0 = W * 0.5, y0 = H * 0.6;
    glow(ctx, x0, y0, 520, 'rgba(255,80,20,A)', 0.22);
    glow(ctx, x0, y0, 200, 'rgba(255,120,40,A)', 0.45);
    glow(ctx, x0, y0, 70, 'rgba(255,190,110,A)', 0.9);
    glow(ctx, x0, y0, 22, 'rgba(255,250,230,A)', 1);
    for (let i = 0; i < 260; i++) {
      const a = -Math.PI / 2 + (r() - 0.5) * 1.5, d = 40 + Math.pow(r(), 0.7) * 620;
      const x = x0 + Math.cos(a) * d * 0.55 + (r() - 0.5) * 60, y = y0 + Math.sin(a) * d;
      const len = 6 + r() * 34, w = 0.6 + r() * 2.4, heat = 1 - d / 700;
      ctx.strokeStyle = 'rgba(255,' + Math.round(110 + heat * 120) + ',' + Math.round(40 + heat * 80) + ',' + (0.25 + heat * 0.7) + ')';
      ctx.lineWidth = w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + (r() - 0.5) * 12, y + len * 0.5, x + (r() - 0.5) * 8, y + len); ctx.stroke();
      if (r() < 0.25) glow(ctx, x, y, 6 + r() * 10, 'rgba(255,160,70,A)', 0.35);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = linear(ctx, [[0, 'rgba(20,6,3,0)'], [1, 'rgba(70,18,6,.7)']], 0, H * 0.75, 0, H); ctx.fillRect(0, H * 0.75, W, H * 0.25);
    return finish(ctx, c, 303, 0.6, 12);
  }

  /* 4. Soletrando: letter tiles spelling the name under a spotlight */
  function paintTiles() {
    const [c, ctx] = canvas(), r = rng(41);
    ctx.fillStyle = linear(ctx, [[0, '#123040'], [0.6, '#0a1820'], [1, '#04080b']]); ctx.fillRect(0, 0, W, H);
    glow(ctx, W * 0.5, H * 0.38, 520, 'rgba(160,220,230,A)', 0.16);
    const pts = { S: 1, O: 1, L: 1, E: 1, T: 1, R: 1, A: 1, N: 1, D: 2 };
    function tile(x, y, s, rot, ch, blur) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      if (blur) ctx.filter = 'blur(' + blur + 'px)';
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = s * 0.35; ctx.shadowOffsetY = s * 0.16;
      rrect(ctx, -s / 2, -s / 2 + s * 0.07, s, s, s * 0.13); ctx.fillStyle = '#b69c74'; ctx.fill();
      ctx.shadowColor = 'transparent';
      rrect(ctx, -s / 2, -s / 2, s, s, s * 0.13); ctx.fillStyle = linear(ctx, [[0, '#fbf3e4'], [1, '#e6d4b4']], -s / 2, -s / 2, s / 2, s / 2); ctx.fill();
      ctx.fillStyle = '#2a2018'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + Math.round(s * 0.62) + 'px Georgia, "Times New Roman", serif';
      ctx.fillText(ch, -s * 0.03, s * 0.03);
      ctx.font = '700 ' + Math.round(s * 0.18) + 'px Georgia, serif';
      ctx.fillText(String(pts[ch] || 1), s * 0.32, s * 0.33);
      ctx.restore();
    }
    for (let i = 0; i < 16; i++) {
      const ch = 'SOLETRANDO'[Math.floor(r() * 10)];
      tile(r() * W, r() * H, 50 + r() * 40, (r() - 0.5) * 1.2, ch, 3 + r() * 4);
    }
    ctx.fillStyle = 'rgba(4,10,14,.45)'; ctx.fillRect(0, 0, W, H);
    const rows = ['SOLE', 'TRAN', 'DO'], s = 118;
    rows.forEach((row, ri) => {
      const y = H * 0.3 + ri * (s + 26);
      const x0 = W / 2 - ((row.length - 1) * (s + 12)) / 2 + (ri === 1 ? 18 : ri === 2 ? -30 : 0);
      [...row].forEach((ch, i) => tile(x0 + i * (s + 12), y + (r() - 0.5) * 18, s, (r() - 0.5) * 0.22, ch, 0));
    });
    for (let i = 0; i < 30; i++) glow(ctx, r() * W, r() * H, 2 + r() * 6, 'rgba(220,245,255,A)', 0.4 + r() * 0.5);
    return finish(ctx, c, 404, 0.72);
  }

  /* 5. Agente de IA: a glowing core with orbits and a node network */
  function paintAgent() {
    const [c, ctx] = canvas(), r = rng(53);
    ctx.fillStyle = linear(ctx, [[0, '#071012'], [1, '#020405']]); ctx.fillRect(0, 0, W, H);
    const cx = W * 0.5, cy = H * 0.44;
    const nodes = [];
    for (let i = 0; i < 46; i++) { const a = r() * Math.PI * 2, d = 200 + r() * 330; nodes.push([cx + Math.cos(a) * d * 0.9, cy + Math.sin(a) * d * 1.25, 1 + r() * 2.5]); }
    ctx.lineWidth = 1;
    nodes.forEach((a, i) => nodes.forEach((b, j) => {
      if (j <= i) return;
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (d < 150) { ctx.strokeStyle = 'rgba(120,230,215,' + (0.22 * (1 - d / 150)) + ')'; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
    }));
    ctx.globalCompositeOperation = 'lighter';
    nodes.forEach(([x, y, s]) => { glow(ctx, x, y, s * 6, 'rgba(140,240,225,A)', 0.5); });
    glow(ctx, cx, cy, 420, 'rgba(60,200,190,A)', 0.2);
    glow(ctx, cx, cy, 190, 'rgba(110,235,220,A)', 0.4);
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath(); ctx.arc(cx, cy, 128, 0, Math.PI * 2);

    const chevron = (d) => h('svg', { className: 'cf-chevron', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': 'true' },
      h('polyline', { points: d === 'left' ? '15 18 9 12 15 6' : '9 18 15 12 9 6' }));

    return h('div', { ref: rootRef, className: 'cf-root', 'data-theme': 'dark' },
      h('style', { dangerouslySetInnerHTML: { __html: CF_CSS } }),
      h('section', { className: 'cf-section' },
        h('div', { className: 'cf-frame' },
          h('div', { ref: containerRef, className: 'cf-fan' },
            cards.map((card, i) => {
              const inner = h('div', { className: 'cf-media' },
                card.imgUrl ? h('img', { src: card.imgUrl, alt: card.alt, className: 'cf-img' }) : null,
                h('div', { className: 'cf-cap' }, h('span', { className: 'cf-title' }, card.title)));
              return card.linkUrl
                ? h('a', { key: i, href: card.linkUrl, target: '_blank', rel: 'noopener noreferrer', className: 'cf-card cf-card--link', 'aria-label': card.title + ', ' + card.desc }, inner)
                : h('div', { key: i, className: 'cf-card', tabIndex: 0, role: 'group', 'aria-label': card.title + ', ' + card.desc }, inner);
            }))),
        needsPagination && h('div', { className: 'cf-controls' },
          h('button', { type: 'button', className: 'cf-arrow', onClick: () => cycle('left'), 'aria-label': 'Anterior' }, chevron('left')),
          h('div', { className: 'cf-dots' }, cards.map((_, i) => h('span', { key: i, className: 'cf-dot' + (i === centerIndex ? ' cf-dot--active' : '') }))),
          h('button', { type: 'button', className: 'cf-arrow', onClick: () => cycle('right'), 'aria-label': 'Próximo' }, chevron('right')))));
  }

  const CF_CSS = `
.cf-root { position: relative; width: 100%; margin: 0; container-type: inline-size; --cf-vh: calc(var(--cf-budget, 0.68) * 1vh); isolation: isolate; -webkit-tap-highlight-color: transparent;

  --cf-arrow-border: rgba(255,255,255,.1); --cf-arrow-border-hover: rgba(255,255,255,.25); --cf-arrow-bg: rgba(255,255,255,.05);
  --cf-arrow-color: rgba(255,255,255,.55); --cf-arrow-color-hover: rgba(255,255,255,.8); --cf-arrow-ring: rgba(255,255,255,.04);
  --cf-arrow-shadow: 0 4px 20px rgba(0,0,0,.4); --cf-dot: rgba(255,255,255,.15); --cf-dot-active: rgba(255,255,255,.8); }
.cf-root *, .cf-root *::before, .cf-root *::after { box-sizing: border-box; }
.cf-section { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; margin: 0; padding: 1rem 0; }
.cf-frame { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 90rem; }
.cf-fan { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 80rem; height: min(38rem, calc(70 * var(--cf-vh, 1vh))); }
.cf-card { position: absolute; display: block; width: min(20rem, calc(36.84 * var(--cf-vh, 1vh))); height: min(35rem, calc(64.47 * var(--cf-vh, 1vh)));
  margin: 0; padding: 0; overflow: clip; border: 1px solid var(--cf-card-border); border-radius: min(3.316rem, calc(6.11 * var(--cf-vh, 1vh)));
  background: #141212; box-shadow: var(--cf-card-shadow); opacity: 0; will-change: transform; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  color: inherit; text-decoration: none; outline: none; }
.cf-card--link { cursor: pointer; }
.cf-card:focus-visible { box-shadow: var(--cf-card-shadow), 0 0 0 3px #ffcf8a; }
.cf-card::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4rem; z-index: 100; height: 4rem; pointer-events: auto; }
.cf-media { position: relative; width: 100%; height: 100%; overflow: hidden; }

.cf-cap { position: absolute; z-index: 11; inset: auto 0 0 0; padding: 3.2rem 1.4rem 1.5rem;
  background: linear-gradient(to top, rgba(6,5,5,.85), rgba(6,5,5,0)); }

.cf-controls { position: relative; z-index: 30; display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1rem; }

.cf-dot { display: block; width: .5rem; height: .5rem; border-radius: 9999px; background: var(--cf-dot); transition: all .3s cubic-bezier(.4,0,.2,1); }
.cf-dot--active { background: var(--cf-dot-active); transform: scale(1.3); }
.cf-arrow { position: relative; z-index: 30; display: flex; flex-shrink: 0; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; margin: 0; padding: 0;
  border: 1.5px solid var(--cf-arrow-border); border-radius: 9999px; background: var(--cf-arrow-bg); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  color: var(--cf-arrow-color); box-shadow: var(--cf-arrow-shadow); font: inherit; cursor: pointer; outline: none;
  transition: color .3s cubic-bezier(.4,0,.2,1), border-color .3s cubic-bezier(.4,0,.2,1); }
.cf-arrow::before { content: ""; position: absolute; inset: 3px; border: 1px solid var(--cf-arrow-ring); border-radius: 9999px; pointer-events: none; }

.cf-arrow:focus-visible { box-shadow: var(--cf-arrow-shadow), 0 0 0 2px #ffcf8a; }
.cf-arrow:active { opacity: .7; }

  .cf-fan { height: min(22rem, calc(70 * var(--cf-vh, 1vh))); }
  .cf-card { width: min(7rem, calc(22.27 * var(--cf-vh, 1vh))); height: min(12.25rem, calc(38.98 * var(--cf-vh, 1vh))); border-radius: min(1.2rem, calc(3.82 * var(--cf-vh, 1vh))); }
  .cf-title { font-size: .66rem; } .cf-cap { padding: 1.3rem .55rem .65rem; }

  /* ================= page ================= */
  function App() {
    const lang = 'en';
    const [active, setActive] = useState(null);
    const [center, setCenter] = useState(3);
    const C = COPY[lang];
    const cards = PROJECTS.map((p) => ({ imgUrl: p.img, alt: p[lang].t, linkUrl: p.link, title: p[lang].t, desc: p[lang].d }));
    const shown = PROJECTS[active == null ? center : active];
    return h(React.Fragment, null,
      h('section', { className: 'intro' }, h('h1', null, C.h1), h('p', null, C.intro)),
      h('main', { className: 'stage' },
        h(CardFanCarousel, { cards, onActive: setActive, onCenter: setCenter }),
        h('div', { className: 'detail', 'aria-live': 'polite' },
          h('div', { className: 'detail-body', key: shown.id },
            h('span', { className: 'status', 'data-s': shown.status }, C.status[shown.status]),
            h('h2', null, shown[lang].t),
            h('p', null, shown[lang].d),
            shown.link
              ? h('a', { className: 'open', href: shown.link, target: '_blank', rel: 'noopener noreferrer' }, C.open)
              : h('span', { className: 'soon' }, C.soon)))));
  }
  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();
</script>
