<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emberson Pieretti</title>
<meta name="description" content="Emberson Pieretti. Explore the projects I am building right now.">
<meta name="theme-color" content="#e2183d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
/*
  LAYOUT: one full-screen stage. The bunny video plays once, walks in and points;
  the 3D button appears exactly where he points and links to /projects/.
*/
:root {
  --red-top: #e2183d;     /* sampled from the video's upper edge */
  --red-bottom: #f04a6c;  /* sampled from the lit floor */
  --ink: #0b0b0c;         /* button body, matches the bunny's shirt */
  --paper: #fff7f4;       /* button label and header text */
  --focus: #ffe08a;
  --f-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: linear-gradient(180deg, var(--red-top) 0%, var(--red-top) 45%, var(--red-bottom) 100%);
  color: var(--paper); font-family: var(--f-display); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.stage { position: fixed; inset: 0; overflow: hidden; }
#bunny { position: absolute; display: block; max-width: none; pointer-events: none; }
/* in the narrow layout the video does not reach the screen edges: fade its top and bottom into the page colour */
.stage.narrow #bunny {
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 9%, #000 88%, transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 9%, #000 88%, transparent 100%);
}

.bar {
  position: fixed; z-index: 5; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 0 max(18px, env(safe-area-inset-left, 0px));
  font-size: .95rem; font-weight: 500; letter-spacing: -0.01em;
}
.bar a { color: var(--paper); text-decoration: none; }
.bar a:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
.bar .to-projects { opacity: .85; }
.bar .to-projects:hover { opacity: 1; }

/* ---------- the 3D button ---------- */
.cta {
  position: absolute; z-index: 4; left: 0; top: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: .6em;
  padding: .95em 1.55em 1em; border-radius: 999px;
  font: 700 clamp(15px, .55rem + .85vw, 26px)/1.12 var(--f-display); letter-spacing: -0.015em; text-align: center;
  color: var(--paper); text-decoration: none;
  background:
    radial-gradient(120% 140% at 50% -20%, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 45%),
    linear-gradient(180deg, #2c2c31 0%, #141417 46%, #060607 54%, #18181b 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.38),
    inset 0 -3px 6px rgba(0,0,0,.65),
    inset 0 0 0 1px rgba(255,255,255,.06),
    0 6px 0 #000,
    0 7px 0 rgba(0,0,0,.35),
    0 16px 22px -6px rgba(90,0,18,.65),
    0 28px 48px -10px rgba(90,0,18,.45);
  opacity: 0; transform: translateY(10px) scale(.86); transform-origin: 100% 50%;
  transition: opacity 300ms cubic-bezier(.16,1,.3,1), transform 300ms cubic-bezier(.16,1,.3,1), box-shadow 150ms ease-out;
  will-change: transform, opacity;
  -webkit-tap-highlight-color: transparent;
}
/* glossy highlight across the top half */
.cta::before {
  content: ""; position: absolute; left: 8%; right: 8%; top: 5%; height: 44%; border-radius: 999px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.04));
}
.cta .dot { width: .55em; height: .55em; border-radius: 50%; flex: none; background: #ff3b5c; box-shadow: 0 0 0 3px rgba(255,59,92,.25), 0 0 12px rgba(255,59,92,.9); }
.cta.show { opacity: 1; transform: translateY(0) scale(1); }
.cta.show:hover { transform: translateY(-2px) scale(1.02); }
.cta.show:active {
  transform: translateY(5px) scale(.99);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 4px rgba(0,0,0,.6), 0 1px 0 #000, 0 8px 14px -6px rgba(90,0,18,.6);
}
.cta:focus-visible { outline: 3px solid var(--focus); outline-offset: 5px; }

@media (prefers-reduced-motion: reduce) {
  .cta { transition: opacity 100ms linear; transform: none; }
  .cta.show, .cta.show:hover, .cta.show:active { transform: none; }
}
</style>
</head>
<body>
<h1 class="sr">Emberson Pieretti</h1>

<header class="bar">
  <a href="/" aria-label="Emberson Pieretti, home">Emberson Pieretti</a>
  <a class="to-projects" href="/projects/">Projects</a>
</header>

<div class="stage" id="stage">
  <video id="bunny" muted playsinline preload="auto" aria-hidden="true">
    <source src="media/bunny.mp4" type="video/mp4">
    <source src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/cloudinarry%20to%20cloudflare/202606021731-e_hqa6sn.mp4" type="video/mp4">
  </video>
  <a class="cta" id="cta" href="/projects/"><span class="dot" aria-hidden="true"></span><span>Explore projects in progress</span></a>
</div>

<script>
(() => {
  'use strict';
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage'), v = document.getElementById('bunny'), cta = document.getElementById('cta');
  const VW = 1920, VH = 1080;
  /* measured on the final frame: the fingertip, and the height of the pointing line */
  const TIP = { x: 1113 / VW, y: 464 / VH };
  const REVEAL_AT = 2.5;          /* seconds: the arm has reached its pointing pose */
  let shown = false, box = { x: 0, y: 0, w: 1, h: 1 };

  function layout() {
    const W = innerWidth, H = innerHeight;
    const narrow = W / H < 1.15;
    stage.classList.toggle('narrow', narrow);
    let w, h, x, y;
    if (!narrow) {
      /* cover the screen, centred */
      const s = Math.max(W / VW, H / VH); w = VW * s; h = VH * s; x = (W - w) / 2; y = (H - h) / 2;
    } else {
      /* show the part of the frame from just left of the target to past the bunny (30% to 92%) */
      const L = 0.3, F = 0.62;
      w = W / F; h = w * VH / VW; x = -L * w; y = Math.max(56, (H - h) * 0.42);
    }
    box = { x, y, w, h };
    /* narrow screens: continue the video's lit floor below it so there is no seam */
    document.body.style.background = narrow
      ? 'linear-gradient(180deg, #e2183d 0px, #e2183d ' + Math.round(y + h * 0.55) + 'px, #f24b6e ' + Math.round(y + h * 0.97) + 'px, #e63a5d ' + H + 'px)'
      : '';
    Object.assign(v.style, { width: w + 'px', height: h + 'px', left: x + 'px', top: y + 'px' });
    placeButton();
  }

  function placeButton() {
    const W = innerWidth;
    const tipX = box.x + TIP.x * box.w, tipY = box.y + TIP.y * box.h;
    const gap = Math.max(14, box.w * 0.012);
    const gutter = 16;
    /* the button sits on the line the finger points along, its right edge just short of the fingertip */
    const maxW = Math.max(150, tipX - gap - gutter);
    cta.style.maxWidth = maxW + 'px';
    const bw = cta.offsetWidth, bh = cta.offsetHeight;
    let left = tipX - gap - bw;
    left = Math.max(gutter, Math.min(left, W - gutter - bw));
    cta.style.left = left + 'px';
    cta.style.top = (tipY - bh / 2) + 'px';
  }

  function reveal() { if (shown) return; shown = true; placeButton(); cta.classList.add('show'); }
  function toEnd() { try { v.currentTime = Math.max(0, (v.duration || 4) - 0.05); } catch (e) {} v.pause(); reveal(); }

  function watch() {
    if (shown) return;
    if (v.currentTime >= REVEAL_AT) reveal(); else requestAnimationFrame(watch);
  }

  layout();
  addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeButton);

  function start() {
    if (REDUCE) { toEnd(); return; }
    const p = v.play();
    if (p && p.catch) p.catch(toEnd);       /* autoplay refused (e.g. low power mode): show the final pose */
    requestAnimationFrame(watch);
  }
  if (v.readyState >= 1) start(); else v.addEventListener('loadedmetadata', start, { once: true });
  v.addEventListener('timeupdate', () => { if (v.currentTime >= REVEAL_AT) reveal(); });
  v.addEventListener('ended', reveal);
  /* if the video cannot load at all, still show the way in */
  setTimeout(() => { if (!shown && (v.readyState < 2 || v.error)) reveal(); }, 4500);
})();
</script>
</body>
</html>
